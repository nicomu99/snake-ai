apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  annotations:
    cloud.google.com/backend-config: '{"default": "backend-ws"}'
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80            # what clients use to reach the service
      targetPort: http    # container port; traffic is forwarded to the pod using this port