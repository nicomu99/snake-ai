apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: muellern99/snake-ai-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
              name: frontend-port
          env:
            - name: BACKEND_URL
              value: http://backend-svc
          readinessProbe:
            httpGet:
              port: frontend-port
              path: /
      restartPolicy: Always
      